<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}离线档案断链核查{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <h1><a href="{{ url_for('main.index') }}">离线档案断链核查</a></h1>
  <p class="tagline">上传抓存目录 → 选入口与回看时刻 → 找出会断的链接</p>
</header>
<main>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in messages %}
  <div class="flash {{ cat }}">{{ msg }}</div>
  {% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>
<footer>时间均为 UTC；数据保存在 SQLite，重启后结论仍可查。</footer>
</body>
</html>
